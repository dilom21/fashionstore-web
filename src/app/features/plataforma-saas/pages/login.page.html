<main class="login-page"><section class="login-card"><span class="eyebrow">FASHIONSTORE · CONTROL DE PLATAFORMA</span><h1>Administración SaaS</h1><p>Acceso exclusivo del superadministrador global. No uses credenciales empresariales.</p><form [formGroup]="form" (ngSubmit)="submit()" novalidate><label for="usuario">Usuario o correo</label><input id="usuario" type="email" autocomplete="username" formControlName="usuario"><small *ngIf="form.controls.usuario.touched && form.controls.usuario.invalid">Ingresa un correo válido.</small><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" formControlName="password"><small *ngIf="form.controls.password.touched && form.controls.password.invalid">La contraseña debe tener al menos 8 caracteres.</small><p class="error" role="alert" *ngIf="error">{{error}}</p><button class="primary" type="submit" [disabled]="loading">{{loading?'Verificando…':'Ingresar'}}</button></form></section></main>
