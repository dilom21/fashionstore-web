<div class="page-title"><div><span class="eyebrow">CU01 · PASO 1</span><h1>Registrar empresa</h1><p>La API crea empresa, configuración y suscripción inicial en una transacción.</p></div></div><form class="panel form-grid" [formGroup]="form" (ngSubmit)="submit()"><label>Razón social<input formControlName="razon_social"></label><label>Nombre comercial<input formControlName="nombre_comercial"></label><label>Slug seguro<input formControlName="slug" placeholder="empresa-ejemplo"><small>a-z, números y guiones</small></label><label>NIT opcional<input formControlName="nit"></label><label>Correo de contacto<input type="email" formControlName="correo_contacto"></label><label>Plan activo<select formControlName="plan_id"><option [ngValue]="0">Selecciona un plan</option><option *ngFor="let p of planes" [ngValue]="p.id">{{p.nombre}} · {{p.max_sucursales_activas}} sucursales</option></select></label><label>Inicio<input type="date" formControlName="fecha_inicio"></label><label>Vencimiento<input type="date" formControlName="fecha_vencimiento"></label><p class="error full" *ngIf="error">{{error}}</p><div class="actions full"><button type="button" class="secondary" (click)="router.navigateByUrl('/plataforma/empresas')">Cancelar</button><button class="primary" [disabled]="loading">{{loading?'Guardando…':'Registrar empresa'}}</button></div></form>
