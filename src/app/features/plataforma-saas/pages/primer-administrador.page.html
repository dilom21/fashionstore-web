<div class="page-title"><div><span class="eyebrow">CU01 · PASO 2</span><h1>Primer administrador</h1><p *ngIf="empresa">Configura la cuenta inicial de <strong>{{empresa.nombre_comercial}}</strong>. Será administrador tenant, no superadministrador.</p><p *ngIf="!empresa">Cargando empresa…</p></div></div><form class="panel form-grid" [formGroup]="form" (ngSubmit)="submit()"><label>Correo<input type="email" formControlName="correo" autocomplete="off"></label><label>Contraseña inicial<input type="password" formControlName="password" autocomplete="new-password"><small>Se envía una sola vez; no se persiste en storage ni logs.</small></label><label>Nombres<input formControlName="nombres"></label><label>Apellidos<input formControlName="apellidos"></label><label>CI<input formControlName="ci"></label><label>ID ciudad activa<input type="number" formControlName="ciudad_id" min="1"></label><label>Nombre sucursal<input formControlName="nombre_sucursal"></label><label>Dirección sucursal<input formControlName="direccion_sucursal"></label><label>Teléfono opcional<input formControlName="telefono"></label><p class="error full" role="alert" *ngIf="error">{{error}}</p><p class="success full" role="status" *ngIf="ok">{{ok}}</p><div class="actions full"><button type="button" class="secondary" (click)="router.navigateByUrl('/plataforma/empresas')">Volver</button><button class="primary" [disabled]="loading||!empresa">{{loading?'Creando…':'Crear administrador inicial'}}</button></div></form>
