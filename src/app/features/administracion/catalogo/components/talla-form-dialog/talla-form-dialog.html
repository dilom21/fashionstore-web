<div class="tfd" (click)="cancelar()">
  <div
    class="tfd__card"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="esCreacion() ? 'Nueva talla' : 'Editar talla'"
    (click)="$event.stopPropagation()"
  >
    <button type="button" class="tfd__close" (click)="cancelar()" aria-label="Cerrar">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="M6 6l12 12M18 6 6 18"></path>
      </svg>
    </button>

    <div class="tfd__icon" aria-hidden="true">
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.9"
      >
        <path d="M4 8h16M4 12h16M4 16h16" />
        <path d="M8 8v8M16 8v8" />
      </svg>
    </div>

    <h2 class="tfd__title">{{ esCreacion() ? 'Nueva talla' : 'Editar talla' }}</h2>
    <p class="tfd__text">
      {{
        esCreacion()
          ? 'Registra una talla para las variantes de producto.'
          : 'Actualiza el nombre de la talla.'
      }}
    </p>

    @if (mensajeError(); as error) {
      <p class="tfd__alert" role="alert">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 8v4.5M12 15.6v.1"></path>
        </svg>
        {{ error }}
      </p>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="tfd__field">
        <label class="tfd__label" for="tfd-nombre">Nombre de la talla</label>
        <input
          class="tfd__input"
          [class.tfd__input--error]="mensajeCampo(form.controls.nombre) !== null"
          id="tfd-nombre"
          type="text"
          formControlName="nombre"
          autocomplete="off"
          placeholder="Ej. M, L, XL, 42"
          [attr.aria-describedby]="mensajeCampo(form.controls.nombre) ? 'tfd-nombre-error' : null"
        />
        @if (mensajeCampo(form.controls.nombre); as msg) {
          <p class="tfd__field-error" id="tfd-nombre-error">{{ msg }}</p>
        }
      </div>

      <div class="tfd__actions">
        <button type="button" class="tfd__btn tfd__btn--ghost" (click)="cancelar()">
          Cancelar
        </button>
        <button
          type="submit"
          class="tfd__btn tfd__btn--primary"
          [disabled]="guardando()"
          [attr.aria-busy]="guardando()"
        >
          @if (guardando()) {
            <span class="tfd__spinner" aria-hidden="true"></span>
            <span>Guardando…</span>
          } @else {
            {{ esCreacion() ? 'Crear talla' : 'Guardar cambios' }}
          }
        </button>
      </div>
    </form>
  </div>
</div>
