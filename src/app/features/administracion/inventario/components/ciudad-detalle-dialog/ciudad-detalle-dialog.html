@if (ciudad(); as ciudad) {
  <div class="cdd" (click)="cerrar()">
    <div
      class="cdd__card"
      role="dialog"
      aria-modal="true"
      aria-label="Detalle de la ciudad"
      (click)="$event.stopPropagation()"
    >
      <button type="button" class="cdd__close" (click)="cerrar()" aria-label="Cerrar">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M6 6l12 12M18 6 6 18"></path>
        </svg>
      </button>

      <div class="cdd__icon" aria-hidden="true">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
        >
          <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 0 1 16 0Z" />
          <circle cx="12" cy="10" r="3" />
        </svg>
      </div>

      <p class="cdd__eyebrow">Ciudad #{{ ciudad.id }}</p>
      <h2 class="cdd__title">{{ ciudad.nombre }}</h2>

      <dl class="cdd__lista">
        <div class="cdd__fila">
          <dt>ID</dt>
          <dd>#{{ ciudad.id }}</dd>
        </div>
        <div class="cdd__fila">
          <dt>Estado</dt>
          <dd>
            @if (ciudad.estado) {
              <span class="cdd__badge cdd__badge--on">Activa</span>
            } @else {
              <span class="cdd__badge cdd__badge--off">Inactiva</span>
            }
          </dd>
        </div>
      </dl>

      <div class="cdd__actions">
        <button type="button" class="cdd__btn" (click)="cerrar()">Cerrar</button>
      </div>
    </div>
  </div>
}
