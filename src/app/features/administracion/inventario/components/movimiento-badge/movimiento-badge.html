<span class="mvb mvb--{{ clase() }}">
  <span class="mvb__icon" aria-hidden="true">
    @switch (tipo()) {
      @case ('ENTRADA_COMPRA') {
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 3v12"></path>
          <path d="m7 10 5 5 5-5"></path>
          <path d="M4 20h16"></path>
        </svg>
      }
      @case ('SALIDA_VENTA') {
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 21V9"></path>
          <path d="m7 14 5-5 5 5"></path>
          <path d="M4 4h16"></path>
        </svg>
      }
      @case ('RESERVA') {
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="5" y="11" width="14" height="9" rx="2"></rect>
          <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
        </svg>
      }
      @case ('LIBERACION_RESERVA') {
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="5" y="11" width="14" height="9" rx="2"></rect>
          <path d="M8 11V8a4 4 0 0 1 7.5-2"></path>
        </svg>
      }
      @case ('DEVOLUCION') {
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M9 14 4 9l5-5"></path>
          <path d="M4 9h11a5 5 0 0 1 0 10h-4"></path>
        </svg>
      }
    }
  </span>
  <span class="mvb__text">{{ etiqueta() }}</span>
</span>
