<article class="pcard">
  <div class="pcard__media">
    <button
      type="button"
      class="pcard__fav"
      (click)="toggleFavorito()"
      [attr.aria-pressed]="favorito()"
      [attr.aria-label]="favorito() ? 'Quitar de favoritos' : 'Añadir a favoritos'"
    >
      @if (favorito()) {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 21s-7.5-4.7-10-9.3C.3 8.6 2 4.9 5.6 4.3c2-.3 4 .6 5 2.2h2.8c1-1.6 3-2.5 5-2.2 3.6.6 5.3 4.3 3.6 7.4C19.5 16.3 12 21 12 21z"/>
        </svg>
      } @else {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M12 20.6S4.5 16 2.4 11.5C.8 8 2.6 4.3 6.1 3.8c2-.3 4 .6 5 2.3h1.8c1-1.7 3-2.6 5-2.3 3.5.5 5.3 4.2 3.7 7.7C19.5 16 12 20.6 12 20.6z"/>
        </svg>
      }
    </button>

    <a
      class="pcard__media-link"
      [routerLink]="['/catalogo/productos', producto().id]"
      [attr.aria-label]="'Ver producto ' + producto().nombre"
    >
      <app-producto-media
        [url]="producto().imagen_principal_url"
        [nombre]="producto().nombre"
        [alt]="'Imagen de ' + producto().nombre"
      />
    </a>
  </div>

  <div class="pcard__body">
    <p class="pcard__cat">{{ producto().categoria.nombre }}</p>
    <a
      class="pcard__name"
      [routerLink]="['/catalogo/productos', producto().id]"
    >
      {{ producto().nombre }}
    </a>

    <div class="pcard__meta">
      <span class="pcard__price">
        Bs {{ producto().precio | number: '1.2-2' }}
      </span>
    </div>

    <button type="button" class="pcard__add" (click)="solicitarAgregar()">
      <span>+ Agregar</span>
    </button>
  </div>
</article>
