<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>FashionStore | Moda online y portal empresarial</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FashionStore — plataforma de moda: compra online, reserva de prendas para probar en sucursal y portal de gestión para empresas.">
  <meta name="theme-color" content="#050914">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="images/products/prod-polera.jpg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FashionStore">
  <script>
    // Evita el parpadeo de tema al cargar. Solo se ejecuta en el navegador.
    (function () {
      try {
        var theme = localStorage.getItem('vanter-theme');
        document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
