<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>VANTER MEN | Moda masculina premium</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VANTER MEN — Ropa y accesorios exclusivamente masculinos. Estilo premium, pago seguro y reserva online para probar en sucursal.">
  <meta name="theme-color" content="#050914">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Evita el parpadeo de tema al cargar. Solo se ejecuta en el navegador.
    (function () {
      try {
        var theme = localStorage.getItem('vanter-theme');
        document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
