name: Plataforma SaaS — Angular 22 regression

on:
  pull_request:
    paths:
      - 'src/app/features/plataforma-saas/**'
      - '.github/workflows/plataforma-saas-regression.yml'
  push:
    branches:
      - fix/plataforma-saas-signals-20261111
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Plataforma UI async DOM tests (zoneless)
        run: npm run test -- --no-watch --no-progress --include=app/features/plataforma-saas/pages/plataforma-saas-zoneless.spec.ts
      - name: Full Angular suite
        run: npm run test -- --no-watch --no-progress
      - name: Production build
        run: npm run build
